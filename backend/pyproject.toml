[project]
name = "db-wrench-backend"
version = "0.1.0"
description = "DB Wrench backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic[email]>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.30",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "argon2-cffi>=23.1",
    "cryptography>=43",
    "pyotp>=2.9",
    "pymongo>=4.8",
    "pymysql>=1.1",
    "prometheus-client>=0.20",
    "pyjwt[crypto]>=2.9",
    "httpx>=0.27",
]

[project.optional-dependencies]
otel = [
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-sdk>=1.27",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "testcontainers[postgres,mysql,mongodb]>=4.8",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pymysql",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "integration: needs Docker (testcontainers)",
    "security: security regression tests",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "SIM"]
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
# Tests use literal SQL, fixture data and deny-list addresses on purpose.
"tests/**" = ["S104", "S105", "S106", "S608", "E501"]
# pytest fixtures imported from another module are re-declared as test arguments.
"tests/integration/test_principals.py" = ["F811", "F401"]
"migrations/**" = ["E501"]
# Adapter metadata queries are static catalog SQL; the only dynamic parts are fixed fragments
# and bound parameters. Client-supplied identifiers never reach these modules as text.
"src/app/database/adapters/*.py" = ["E501", "S608"]
# Write/bulk SQL: identifiers come from fetched metadata and are dialect-quoted, values are bound.
"src/app/database/relational/editing.py" = ["E501", "S608"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["app.database.*", "app.auth.*"]
disallow_untyped_defs = true
