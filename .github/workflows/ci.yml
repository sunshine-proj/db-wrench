name: CI

on:
  push: { branches: [main] }
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.13.7"
  PNPM_VERSION: "10.34.9"

jobs:
  backend-quality:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { version: "${{ env.UV_VERSION }}", enable-cache: true }
      - run: uv sync --frozen --extra otel
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run mypy src
      - name: Unit tests
        run: uv run pytest tests/unit -q

  backend-integration:
    # Every supported engine version is exercised at least once (AGENTS.md section 3).
    runs-on: ubuntu-latest
    needs: backend-quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - { pg: "postgres:14-alpine", mysql: "mysql:8.0", mongo: "mongo:6.0" }
          - { pg: "postgres:15-alpine", mysql: "mysql:8.4", mongo: "mongo:7.0" }
          - { pg: "postgres:16-alpine", mysql: "mysql:8.4", mongo: "mongo:8.0" }
          - { pg: "postgres:17.6-alpine", mysql: "mysql:8.4", mongo: "mongo:7.0" }
    env:
      DBW_TEST_PG_IMAGE: ${{ matrix.pg }}
      DBW_TEST_MYSQL_IMAGE: ${{ matrix.mysql }}
      DBW_TEST_MONGO_IMAGE: ${{ matrix.mongo }}
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { version: "${{ env.UV_VERSION }}", enable-cache: true }
      - run: uv sync --frozen --extra otel
      - name: Integration and security tests
        run: uv run pytest tests/integration -q

  openapi-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { version: "${{ env.UV_VERSION }}" }
      - run: cd backend && uv sync --frozen
      - name: Regenerate OpenAPI and fail on any change
        run: |
          cd backend && uv run python ../scripts/export_openapi.py > ../docs/openapi.json
          git diff --exit-code -- ../docs/openapi.json || {
            echo "::error::API contract changed. Run 'make openapi', review the diff for breaking changes and commit it."; exit 1; }

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm exec eslint src
      - run: pnpm exec prettier --check src
      - run: pnpm exec vitest run
      - run: pnpm build

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { version: "${{ env.UV_VERSION }}" }
      - name: Python dependencies
        run: |
          cd backend && uv export --frozen --no-dev --no-hashes --no-emit-project > /tmp/requirements.txt
          uvx pip-audit --requirement /tmp/requirements.txt --strict
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - name: JavaScript dependencies
        run: cd frontend && pnpm audit --prod --audit-level high

  docker:
    runs-on: ubuntu-latest
    needs: [backend-quality, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose files
        run: |
          ./scripts/init-env.sh
          docker compose config --quiet
          ./scripts/init-secrets.sh
          printf x > secrets/tls_cert.pem; printf x > secrets/tls_key.pem
          DBW_VERSION=ci docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet
          rm -rf secrets
      - name: Build images
        run: docker compose build
      - name: Smoke test (migrate, health, edge routing)
        run: |
          docker compose up -d --wait --wait-timeout 180
          curl -fsS http://127.0.0.1:8080/api/v1/auth/setup-status
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/health/ready)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/metrics)" = 404
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Scan images
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: dbwrench/backend:dev
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: dbwrench/frontend:dev
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
