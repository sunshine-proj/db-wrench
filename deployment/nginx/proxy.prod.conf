# Reverse proxy, production: TLS termination, HSTS, HTTP->HTTPS redirect.
# Certificates are mounted at /run/secrets/tls_cert and /run/secrets/tls_key.
limit_req_zone $binary_remote_addr zone=auth:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
limit_req_status 429;

upstream backend  { server backend:8000; keepalive 16; }
upstream frontend { server frontend:8081; keepalive 16; }

server {
    listen 8080;
    server_name _;
    location = /proxy-health { access_log off; add_header Content-Type text/plain; return 200 "ok\n"; }
    location / { return 308 https://$host$request_uri; }
}

server {
    listen 8443 ssl;
    http2 on;
    server_name _;
    server_tokens off;
    client_max_body_size 1m;

    ssl_certificate     /run/secrets/tls_cert;
    ssl_certificate_key /run/secrets/tls_key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    location = /metrics  { return 404; }
    location /health/    { return 404; }

    # Endpoints that check credentials or start a login get the strict per-address limit
    # (defence in depth beside the application's own lockout). Read-only calls the single-page
    # app makes on every page load (/auth/session, /auth/setup-status, /auth/oidc/config) fall
    # under the general API limit: throttling them signs users out of the interface.
    location ~ ^/api/v1/auth/(login|setup|password|mfa/.+|oidc/login|oidc/callback)$ {
        limit_req zone=auth burst=10 nodelay;
        include /etc/nginx/dbwrench-proxy-params.conf;
        proxy_pass http://backend;
    }
    location /api/v1/auth/ {
        limit_req zone=api burst=60 nodelay;
        include /etc/nginx/dbwrench-proxy-params.conf;
        proxy_pass http://backend;
    }
    location /api/ {
        limit_req zone=api burst=60 nodelay;
        include /etc/nginx/dbwrench-proxy-params.conf;
        proxy_read_timeout 60s;
        proxy_pass http://backend;
    }
    location / {
        proxy_set_header Host $http_host;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_pass http://frontend;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    }
}
